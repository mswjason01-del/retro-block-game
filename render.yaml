services:
  - type: web
    name: retro-block-game
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: retro-block-game-db
          property: connectionString

databases:
  - name: retro-block-game-db
    region: oregon
    plan: free
