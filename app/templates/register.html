{% extends 'base.html' %}{% block title %}Create account — Block Game{% endblock %}{% block content %}<section class="form-card"><p class="eyebrow">READY, PLAYER ONE?</p><h1>CREATE ACCOUNT</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>USERNAME<input name="username" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" aria-describedby="username-help"></label><small id="username-help">3–20 letters, numbers, or underscores.</small><label>PASSWORD<input type="password" name="password" autocomplete="new-password" required minlength="8"></label><label>CONFIRM PASSWORD<input type="password" name="confirm_password" autocomplete="new-password" required minlength="8"></label><button class="button primary" type="submit">START PLAYING</button></form><p>Already playing? <a href="{{ url_for('auth.login') }}">Log in</a>.</p></section>{% endblock %}
